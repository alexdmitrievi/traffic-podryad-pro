name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref: a red result for a commit nobody is looking at
# any more only teaches people to ignore the badge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  # Repository-level checks. These are dependency-free on purpose and run without an
  # install step, so a broken dependency tree can never disable them.
  guards:
    name: Repository guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Agent documentation identity (CLAUDE.md == AGENTS.md)
        run: bun scripts/check-agent-docs.mjs

      - name: Repository consistency
        run: bun scripts/repo-env.mjs

      - name: Architecture boundaries (AC-1, AC-2, AC-3)
        run: bun scripts/architecture-check.mjs

      - name: Secret scan
        run: bun scripts/check-secrets.mjs

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install workspace
        run: bun install --frozen-lockfile

      # Fixture tests for the checkers above. They assert both directions — a violating
      # fixture must fail and an allowed one must pass — so a checker cannot be gutted
      # without turning this job red.
      - name: Repository script tests
        run: bun run test:scripts

      - name: Contract tests
        run: bun run test:contracts

      # Structural assertions on schema.prisma: workspace scoping, UUIDv7 keys, the
      # NOT NULL approval on publications, the absence of vector columns, and every enum
      # matching its counterpart in @traffic/contracts.
      - name: Schema and seed tests
        run: bun run test:schema

      - name: Catalog seed data
        run: bun run seed:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install workspace
        run: bun install --frozen-lockfile

      # Real for @traffic/contracts, still a placeholder for the surfaces that have no
      # TypeScript yet. scripts/repo-env.mjs fails the guards job if a workspace gains
      # sources while its typecheck is still an echo, so a placeholder cannot outlive its
      # workspace being empty.
      - name: Typecheck workspaces
        run: bun run typecheck

  schema:
    name: Prisma schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install workspace
        run: bun install --frozen-lockfile

      # Parses and validates the schema. No database is contacted: Prisma 7 keeps connection
      # URLs out of the schema entirely. Migrations are applied in the integration job.
      - name: Validate schema
        run: bun run prisma:validate

      - name: Generate client
        run: bun run prisma:generate

  integration:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pipupi_test
          POSTGRES_USER: pipupi
          POSTGRES_PASSWORD: pipupi_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipupi -d pipupi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pipupi:pipupi_local_password@localhost:5432/pipupi_test
      TEST_DATABASE_URL: postgresql://pipupi:pipupi_local_password@localhost:5432/pipupi_test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install workspace
        run: bun install --frozen-lockfile

      # The backend script runs prisma generate, prisma migrate deploy against the test
      # database and then the integration suite: the outbox claim protocol under
      # concurrency, health readiness and the catalog seed.
      - name: Run integration tests
        run: bun run test:integration

  e2e:
    name: E2E (SEO slice)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pipupi_test
          POSTGRES_USER: pipupi
          POSTGRES_PASSWORD: pipupi_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipupi -d pipupi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pipupi:pipupi_local_password@localhost:5432/pipupi_test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx --bun playwright install --with-deps chromium

      # The mandatory E2E: the 11-step SEO slice through the real backend, database,
      # webapp and published page (docs/TESTING.md section 6).
      - name: Run the SEO slice E2E
        run: bun run e2e:webapp

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install workspace
        run: bun install --frozen-lockfile

      # Nothing produces artifacts yet; this becomes the website and webapp build in Wave 4.
      - name: Build workspaces
        run: bun run build

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validates and renders the compose file. Client-side only: no daemon, no images
      # pulled, no containers started.
      - name: Validate docker-compose.yml
        run: docker compose --env-file backend/.env.example config --quiet

      - name: Confirm the local database image is postgres:18-alpine
        run: |
          docker compose --env-file backend/.env.example config \
            | grep -q 'image: postgres:18-alpine'
